<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — THE WARDROBE EDIT</title><link rel="stylesheet" href="assets/site.css"><script src="assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-client.js" defer></script><script src="scripts/auth.js" defer></script></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html"><small>THE PERSONAL STYLE SYSTEM</small><strong>THE WARDROBE EDIT</strong></a><a href="login.html">Sign in</a></header><main class="auth-wrap"><section class="auth-card"><div class="eyebrow">Account recovery</div><h1>Reset password</h1><p class="muted">Enter your email address and we'll send a reset link if an account exists.</p><div id="message" class="message" role="status"></div><form id="resetForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><button class="btn wide" type="submit">Send reset link</button></form><div class="auth-foot"><a href="login.html">Back to sign in</a></div></section></main></div></bo<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE WARDROBE EDIT</title>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-client.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
    background:#080909;
      color:#f4f0e6;
        font-family:Arial,sans-serif
        }
        header{
          height:58px;
            padding:10px 18px;
              display:flex;
                align-items:center;
                  justify-content:space-between;
                    border-bottom:1px solid #40351d;
                      background:#10100d
                      }
                      .brand{
                        font:20px Georgia,serif;
                          letter-spacing:2px;
                            color:#f2d27a
                            }
                            button{
                              background:#191916;
                                color:#f4f0e6;
                                  border:1px solid #59451f;
                                    border-radius:8px;
                                      padding:9px 14px
                                      }
                                      iframe{
                                        width:100%;
                                          height:calc(100vh - 58px);
                                            border:0;
                                              display:block
                                              }
                                              #status{
                                                padding:30px;
                                                  font:16px Arial
                                                  }
                                                  </style>
                                                  </head>

                                                  <body>

                                                  <header>
                                                    <div class="brand">THE WARDROBE EDIT</div>
                                                      <button id="logout">Sign out</button>
                                                      </header>

                                                      <div id="status">Checking your account…</div>

                                                      <iframe id="app" title="Your wardrobe" hidden></iframe>

                                                      <script>
                                                      (async()=>{
                                                        const status=document.getElementById('status');
                                                          const client=window.tweSupabase;

                                                            if(!client){
                                                                status.textContent='Connection error. Please try again.';
                                                                    return;
                                                                      }

                                                                        const {data:{session}}=await client.auth.getSession();

                                                                          if(!session){
                                                                              location.replace('login.html');
                                                                                  return;
                                                                                    }

                                                                                      document.getElementById('app').src='legacy-v0.7.html';
                                                                                        document.getElementById('app').hidden=false;
                                                                                          status.hidden=true;

                                                                                            document.getElementById('logout').onclick=async()=>{
                                                                                                await client.auth.signOut();
                                                                                                    location.replace('index.html');
                                                                                                      };
                                                                                                      })();
                                                                                                      </script>

                                                                                                      </body>
                                                                                                      </html>
